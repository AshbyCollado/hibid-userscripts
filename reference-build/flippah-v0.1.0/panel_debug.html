    <section class="lotlens-panel" aria-label="Flippah true cost calculator">
      <header class="lotlens-header">
        <span class="lotlens-wordmark">Flippah</span>
        <span class="lotlens-premium-source" title="estimated — tap to set">estimated — tap to set</span>
      </header>
      <p class="lotlens-degraded" hidden="">
        Couldn't read this page automatically. Enter the current bid below.
        <a class="lotlens-report-link" target="_blank" rel="noopener noreferrer" href="https://github.com/Halid-ab/lotlens/issues/new?title=HiBid+page+parsing+failure&amp;body=Flippah+couldn%27t+parse+this+page%3A%0A%0Ahttps%3A%2F%2Fhibid.com%2Flot%2F200000001%2Ftest1%0A%0AWhat+I+expected%3A%0A">Report this page</a>
      </p>
      <div class="lotlens-cost-table">
        <div class="lotlens-row">
          <label for="lotlens-current-bid">Current bid</label>
          <input id="lotlens-current-bid" class="lotlens-money-input" inputmode="decimal" aria-label="Current bid" placeholder="0.00" hidden="">
          <output class="lotlens-current-bid-output">$10.00</output>
        </div>
        <div class="lotlens-row">
          <label for="lotlens-premium">Buyer's premium</label>
          <span class="lotlens-inline-input"><input id="lotlens-premium" type="number" min="0" max="30" step="0.1" aria-label="Buyer's premium percentage"><span>%</span></span>
        </div>
        <div class="lotlens-row lotlens-tax-row">
          <label for="lotlens-state">Sales tax</label>
          <span class="lotlens-tax-control">
            <select id="lotlens-state" aria-label="Sales tax state"><option value="" selected="">Set your state</option><option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option><option value="AR">Arkansas</option><option value="CA">California</option><option value="CO">Colorado</option><option value="CT">Connecticut</option><option value="DE">Delaware</option><option value="DC">District of Columbia</option><option value="FL">Florida</option><option value="GA">Georgia</option><option value="HI">Hawaii</option><option value="ID">Idaho</option><option value="IL">Illinois</option><option value="IN">Indiana</option><option value="IA">Iowa</option><option value="KS">Kansas</option><option value="KY">Kentucky</option><option value="LA">Louisiana</option><option value="ME">Maine</option><option value="MD">Maryland</option><option value="MA">Massachusetts</option><option value="MI">Michigan</option><option value="MN">Minnesota</option><option value="MS">Mississippi</option><option value="MO">Missouri</option><option value="MT">Montana</option><option value="NE">Nebraska</option><option value="NV">Nevada</option><option value="NH">New Hampshire</option><option value="NJ">New Jersey</option><option value="NM">New Mexico</option><option value="NY">New York</option><option value="NC">North Carolina</option><option value="ND">North Dakota</option><option value="OH">Ohio</option><option value="OK">Oklahoma</option><option value="OR">Oregon</option><option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option><option value="SC">South Carolina</option><option value="SD">South Dakota</option><option value="TN">Tennessee</option><option value="TX">Texas</option><option value="UT">Utah</option><option value="VT">Vermont</option><option value="VA">Virginia</option><option value="WA">Washington</option><option value="WV">West Virginia</option><option value="WI">Wisconsin</option><option value="WY">Wyoming</option></select>
            <output class="lotlens-tax-rate">0.00%</output>
          </span>
        </div>
        <div class="lotlens-row">
          <label for="lotlens-shipping">Shipping</label>
          <span class="lotlens-inline-input lotlens-shipping-input"><span>$</span><input id="lotlens-shipping" type="number" min="0" step="0.01" inputmode="decimal" aria-label="Estimated shipping cost" placeholder="0.00"></span>
        </div>
        <div class="lotlens-divider"></div>
        <div class="lotlens-row lotlens-total-row">
          <span>True cost if you win now</span>
          <output class="lotlens-true-cost lotlens-updated">$11.50</output>
        </div>
      </div>
      <div class="lotlens-cards">
        <section class="lotlens-card lotlens-profit-card">
          <label class="lotlens-card-label" for="lotlens-resale">Est. resale value</label>
          <span class="lotlens-budget-input"><span>$</span><input id="lotlens-resale" type="number" min="0" step="0.01" inputmode="decimal" aria-label="Estimated resale value" placeholder="100.00"></span>
          <output class="lotlens-profit-output">Enter resale value</output>
        </section>
        <section class="lotlens-card">
          <label class="lotlens-card-label" for="lotlens-budget">Max bid</label>
          <span class="lotlens-budget-input"><span>$</span><input id="lotlens-budget" type="number" min="0" step="0.01" inputmode="decimal" aria-label="Max bid" placeholder="10.00"></span>
          <output class="lotlens-max-bid">All-in cost: $57.50</output>
        </section>
      </div>
      <div class="lotlens-comps">
        <label class="lotlens-card-label" for="lotlens-comps-query">eBay sold search</label>
        <div class="lotlens-comps-controls">
          <input id="lotlens-comps-query" type="text" aria-label="eBay sold listings search query">
          <a class="lotlens-button lotlens-comps-link" target="_blank" rel="noopener noreferrer" href="https://www.ebay.com/sch/i.html?_nkw=test+lot&amp;LH_Sold=1&amp;LH_Complete=1">View solds</a>
          <a class="lotlens-button lotlens-deep-link" target="_blank" rel="noopener noreferrer" href="https://www.ebay.com/sh/research?marketplace=EBAY-US&amp;dayRange=1095&amp;tabName=SOLD&amp;tz=America%2FNew_York&amp;q=test+lot">Deep research</a>
        </div>
      </div>
      <div class="lotlens-actions">
        <button class="lotlens-button lotlens-watch-button" type="button">Watch + alert me</button>
        <button class="lotlens-secondary-button lotlens-note-button" type="button">Note</button>
      </div>
      <p class="lotlens-alert-gate" hidden="">
        <span class="lotlens-pro-pill">Pro</span> Ending-soon and over-max alerts are locked.
        <button class="lotlens-upgrade-link" type="button">Upgrade</button>
      </p>
      <p class="lotlens-watch-status" aria-live="polite"></p>
      <div class="lotlens-note-editor" hidden="">
        <label for="lotlens-note">Private lot note</label>
        <textarea id="lotlens-note" rows="3" aria-label="Private lot note" placeholder="Condition, pickup plan, research…"></textarea>
      </div>
    </section>
